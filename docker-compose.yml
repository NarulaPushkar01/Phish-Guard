version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: phishguard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: phishguard
    networks:
      - phishguard-network

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishguard-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/phishguard
      - JWT_SECRET_KEY=docker-dev-secret-change-in-production
      - FLASK_ENV=development
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/venv
    networks:
      - phishguard-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - phishguard-network

volumes:
  mongodb_data:

networks:
  phishguard-network:
    driver: bridge
